<!DOCTYPE html>
<!--
  This used to be a full contact page with its own nav item. Contact moved
  onto the About page as a tile instead, and this file was kept only so
  that /contact.html (old links, bookmarks, anything that still points here)
  doesn't 404 and lands somewhere useful. Safe to delete once nothing links
  to the old path anymore.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=about.html#contact" />
    <link rel="canonical" href="about.html#contact" />
    <title>Redirecting to About…</title>
    <script>
      location.replace("about.html#contact");
    </script>
  </head>
  <body>
    <p>Contact now lives on the <a href="about.html#contact">About page</a>.</p>
  </body>
</html>
